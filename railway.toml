# Railway Configuration
# NOTE: For Docker deployments, Railway automatically detects Dockerfile.
# The Dockerfile handles all build and start commands via CMD.
# No startCommand needed here - it would conflict with Docker's CMD.

[deploy]
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
healthcheckPath = "/api"
healthcheckTimeout = 100

[env]
NODE_ENV = "production"

version: '3.8'

# Development compose file with hot reload
services:
  # MongoDB Database
  mongodb:
    image: mongo:7.0
    container_name: ai-content-creator-mongodb-dev
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: ai-content-creator
    volumes:
      - mongodb_data_dev:/data/db
    networks:
      - ai-content-creator-dev-network

  # Redis for Bull Queue
  redis:
    image: redis:7-alpine
    container_name: ai-content-creator-redis-dev
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data_dev:/data
    networks:
      - ai-content-creator-dev-network
    command: redis-server --appendonly yes

  # API with hot reload
  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
      target: api-dev
    container_name: ai-content-creator-api-dev
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      DATABASE_URL: mongodb://mongodb:27017/ai-content-creator
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    volumes:
      - ./apps/api/src:/app/apps/api/src
      - ./apps/api/prisma:/app/apps/api/prisma
      - /app/node_modules
      - /app/apps/api/node_modules
    depends_on:
      - mongodb
      - redis
    networks:
      - ai-content-creator-dev-network

  # Client with hot reload
  client:
    build:
      context: .
      dockerfile: Dockerfile.dev
      target: client-dev
    container_name: ai-content-creator-client-dev
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:3000/api
    volumes:
      - ./apps/client/src:/app/apps/client/src
      - ./apps/client/public:/app/apps/client/public
      - /app/node_modules
      - /app/apps/client/node_modules
    depends_on:
      - api
    networks:
      - ai-content-creator-dev-network

networks:
  ai-content-creator-dev-network:
    driver: bridge

volumes:
  mongodb_data_dev:
    driver: local
  redis_data_dev:
    driver: local

# Render Blueprint for Full Stack Deployment
# Alternative to Vercel + Railway split deployment
# This deploys everything on Render

services:
  # Web Service (API + Frontend)
  - type: web
    name: ai-content-creator
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /api
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        fromDatabase:
          name: ai-content-creator-mongodb
          property: connectionString
      - key: REDIS_HOST
        fromService:
          name: ai-content-creator-redis
          type: redis
          property: host
      - key: REDIS_PORT
        fromService:
          name: ai-content-creator-redis
          type: redis
          property: port
      - key: REDIS_PASSWORD
        fromService:
          name: ai-content-creator-redis
          type: redis
          property: password
      - key: JWT_SECRET
        generateValue: true
        sync: false
      - key: GEMINI_API_KEY
        sync: false

# Note: Render's free tier doesn't include MongoDB
# You'll need to use MongoDB Atlas (free tier available)
# Update the DATABASE_URL env var with your Atlas connection string

# Redis is available on paid plans
# For free deployment, use Upstash Redis and manually set env vars
